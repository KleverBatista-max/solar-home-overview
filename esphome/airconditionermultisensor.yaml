esphome:
  name: airconditionermultisensor
  friendly_name: airconditionermultisensor

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "<REDACTADO>"

ota:
  - platform: esphome
    password: "<REDACTADO>"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.68.64
  ap:
    ssid: "Airconditionermultisensor"
    password: "<REDACTADO>"

captive_portal:

one_wire:
  - platform: gpio
    pin: GPIO4

sensor:
  - platform: adc
    pin: GPIO34
    id: ct_raw
    attenuation: 11db
    update_interval: 200ms
    filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 30

  - platform: ct_clamp
    sensor: ct_raw
    name: "Aire Corriente"
    id: aire_current
    update_interval: 1s
    accuracy_decimals: 2
    filters:
      - calibrate_linear:
          - 0.00 -> 0.00
          - 0.01 -> 0.153
      - lambda: |-
          if (isnan(x)) return 0.0f;
          return (fabsf(x) < 0.20f) ? 0.0f : x;

  - platform: template
    name: "Aire Potencia"
    id: aire_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 1s
    lambda: |-
      float a = id(aire_current).state;
      if (isnan(a) || a <= 0.0f) return 0.0f;

      if (a < 1.0f) {
        return a * 120.0f;
      } else {
        return a * 220.0f;
      }

  - platform: dallas_temp
    name: "Temperatura Aire"
    id: temp_aire
    update_interval: 15s
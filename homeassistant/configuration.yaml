# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

template:
  - trigger:
      - platform: time_pattern
        minutes: "/5"

    sensor:
      - name: "AC Solar Debug"
        unique_id: ac_solar_debug
        state: >
          {% set runtime = states('sensor.battery_runtime_hours_at_current_load')|float(0) %}
          {% set hora_conf = states('input_number.solar_hora_confianza')|float(9.5) %}
          {% set hora = now().hour + (now().minute / 60) %}
          {% set horas_hasta = [hora_conf - hora, 0] | max %}
          {% set solar_total = states('sensor.solar_total_power')|float(0) %}
          {% set load_total = states('sensor.inverter_load_total')|float(0) %}
          {% set forecast_now = (
            states('sensor.power_production_now')|float(0)
            + states('sensor.power_production_now_2')|float(0)
          ) %}
          {% set forecast_next = (
            states('sensor.energy_next_hour')|float(0)
            + states('sensor.energy_next_hour_2')|float(0)
          ) %}
          {% set soc = states('sensor.inverter_battery_soc')|float(0) %}
          {% set soc_min = states('input_number.soc_minimo')|float(0) %}
          {% set alcanza = states('sensor.alcanza_a_cargar_hoy') == 'True' %}
          {% set modo = states('input_select.ac_modo_amanecer')|string|trim %}
          {% set etapa = states('input_select.aire_pro_etapa')|string|trim %}
          {% set sun_up = is_state('sun.sun','above_horizon') %}
          {% set confort_base =
            modo == 'confort'
            and etapa in ['20','21','22']
            and sun_up
            and now().hour < 11
          %}
          {% set confort_sostenible =
            confort_base
            and soc > soc_min
            and (
              (
                hora < hora_conf
                and (
                  runtime >= (horas_hasta * 0.75)
                  or (
                    soc >= (soc_min + 12)
                    and forecast_next >= 0.35
                  )
                  or alcanza
                )
              )
              or
              (
                hora >= hora_conf
                and (
                  states('sensor.inverter_battery_power')|float(0) <= 0
                  or solar_total >= load_total
                  or forecast_now >= load_total
                )
              )
            )
          %}
          {% if horas_hasta > 0.05 %}
            {% set ratio = (runtime / horas_hasta) %}
            {% set modo_debug = 'MANANA' %}
          {% else %}
            {% set ratio = 0 %}
            {% set modo_debug = 'TARDE' %}
          {% endif %}
          {{ states('sensor.solar_estado_real') }} |
          AC {{ states('sensor.airconditionermultisensor_aire_potencia')|float(0)|round(0) }}W |
          Batt {{ states('sensor.inverter_battery_power')|float(0)|round(0) }}W |
          SOC {{ soc|round(1) }}% |
          Set {{ states('input_text.ac_last_set') }} |
          {{ states('input_select.ac_estado') }} |
          RT {{ runtime|round(2) }}h |
          Need {{ horas_hasta|round(2) }}h |
          R {{ ratio|round(2) }} |
          Mode {{ modo_debug }} |
          Conf {{ 'Y' if confort_sostenible else 'N' }} |
          Sol {{ solar_total|round(0) }}W |
          Load {{ load_total|round(0) }}W |
          M {{ (solar_total - load_total)|round(0) }}W |
          Fnow {{ forecast_now|round(0) }}W |
          Fnext {{ forecast_next|round(2) }}kWh |
          Err {{ (forecast_now - solar_total)|round(0) }}W |
          Warn {{ states('input_number.ac_warn_streak')|float(0)|round(0) }} |
          Off {{ states('input_number.ac_off_streak')|float(0)|round(0) }} |
          Act {{ states('input_text.ac_solar_last_action') }}

        attributes:
          solar_estado: "{{ states('sensor.solar_estado_real') }}"
          ac_w: "{{ states('sensor.airconditionermultisensor_aire_potencia')|float(0)|round(0) }}"
          batt_w: "{{ states('sensor.inverter_battery_power')|float(0)|round(0) }}"
          soc: "{{ states('sensor.inverter_battery_soc')|float(0)|round(1) }}"
          soc_min: "{{ states('input_number.soc_minimo')|float(0)|round(1) }}"
          ac_last_set: "{{ states('input_text.ac_last_set') }}"
          ac_estado: "{{ states('input_select.ac_estado') }}"
          aire_pro_etapa: "{{ states('input_select.aire_pro_etapa') }}"
          modo_amanecer: "{{ states('input_select.ac_modo_amanecer') }}"
          warn_streak: "{{ states('input_number.ac_warn_streak')|float(0)|round(0) }}"
          off_streak: "{{ states('input_number.ac_off_streak')|float(0)|round(0) }}"
          last_action: "{{ states('input_text.ac_solar_last_action') }}"
          runtime_actual_h: "{{ states('sensor.battery_runtime_hours_at_current_load')|float(0)|round(2) }}"
          solar_hora_confianza: "{{ states('input_number.solar_hora_confianza')|float(9.5)|round(2) }}"
          hora_actual_decimal: "{{ (now().hour + (now().minute / 60))|round(2) }}"
          horas_hasta_confianza: >
            {{ [states('input_number.solar_hora_confianza')|float(9.5) - (now().hour + (now().minute / 60)), 0] | max | round(2) }}
          runtime_ratio: >
            {% set runtime = states('sensor.battery_runtime_hours_at_current_load')|float(0) %}
            {% set hora_conf = states('input_number.solar_hora_confianza')|float(9.5) %}
            {% set hora = now().hour + (now().minute / 60) %}
            {% set horas_hasta = [hora_conf - hora, 0] | max %}
            {{ ((runtime / horas_hasta) if horas_hasta > 0 else 99) | round(2) }}
          solar_total: "{{ states('sensor.solar_total_power')|float(0)|round(0) }}"
          load_total: "{{ states('sensor.inverter_load_total')|float(0)|round(0) }}"
          solar_margin: >
            {{ (states('sensor.solar_total_power')|float(0) - states('sensor.inverter_load_total')|float(0)) | round(0) }}
          forecast_power_now_total: >
            {{ (states('sensor.power_production_now')|float(0) + states('sensor.power_production_now_2')|float(0)) | round(0) }}
          forecast_next_hour_kwh: >
            {{ (states('sensor.energy_next_hour')|float(0) + states('sensor.energy_next_hour_2')|float(0)) | round(2) }}
          alcanza: "{{ states('sensor.alcanza_a_cargar_hoy') == 'True' }}"
          confort_sostenible: >
            {% set runtime = states('sensor.battery_runtime_hours_at_current_load')|float(0) %}
            {% set hora_conf = states('input_number.solar_hora_confianza')|float(9.5) %}
            {% set hora = now().hour + (now().minute / 60) %}
            {% set horas_hasta = [hora_conf - hora, 0] | max %}
            {% set solar_total = states('sensor.solar_total_power')|float(0) %}
            {% set load_total = states('sensor.inverter_load_total')|float(0) %}
            {% set forecast_now = (
              states('sensor.power_production_now')|float(0)
              + states('sensor.power_production_now_2')|float(0)
            ) %}
            {% set forecast_next = (
              states('sensor.energy_next_hour')|float(0)
              + states('sensor.energy_next_hour_2')|float(0)
            ) %}
            {% set soc = states('sensor.inverter_battery_soc')|float(0) %}
            {% set soc_min = states('input_number.soc_minimo')|float(0) %}
            {% set alcanza = states('sensor.alcanza_a_cargar_hoy') == 'True' %}
            {% set modo = states('input_select.ac_modo_amanecer')|string|trim %}
            {% set etapa = states('input_select.aire_pro_etapa')|string|trim %}
            {% set sun_up = is_state('sun.sun','above_horizon') %}
            {% set confort_base =
              modo == 'confort'
              and etapa in ['20','21','22']
              and sun_up
              and now().hour < 11
            %}
            {{
              confort_base
              and soc > soc_min
              and (
                (
                  hora < hora_conf
                  and (
                    runtime >= (horas_hasta * 0.75)
                    or (
                      soc >= (soc_min + 12)
                      and forecast_next >= 0.35
                    )
                    or alcanza
                  )
                )
                or
                (
                  hora >= hora_conf
                  and (
                    states('sensor.inverter_battery_power')|float(0) <= 0
                    or solar_total >= load_total
                    or forecast_now >= load_total
                  )
                )
              )
            }}
    
  - sensor:
      - name: "Battery Runtime Hours At Current Load"
        unique_id: battery_runtime_hours_at_current_load
        unit_of_measurement: "h"
        state_class: measurement
        state: >
         {% set soc = states('sensor.inverter_battery_soc')|float(0) %}
         {% set soc_min = states('input_number.soc_minimo')|float(0) %}
         {% set batt_kwh = states('input_number.battery_kwh')|float(14.336) %}
         {% set batt_w = states('sensor.inverter_battery_power')|float(0) %}

         {% set usable_kwh = ((soc - soc_min) / 100) * batt_kwh %}

         {% if usable_kwh <= 0 %}
           0
         {% elif batt_w > 50 %}
           {{ (usable_kwh / (batt_w / 1000)) | round(2) }}
         {% elif batt_w <= 0 %}
           {{ this.state if this.state not in ['unknown','unavailable','none',''] else 99 }}
         {% else %}
           {{ this.state if this.state not in ['unknown','unavailable','none',''] else 99 }}
         {% endif %}
    
      - name: "Solar Estado Real"
        unique_id: solar_estado_real
        state: >
          {% set solar = states('sensor.solar_total_power')|float(0) %}
          {% set batt = states('sensor.inverter_battery_power')|float(0) %}
          {% set ac_w = states('sensor.airconditionermultisensor_aire_potencia')|float(0) %}
          {% set load_total = states('sensor.inverter_load_total')|float(0) %}
          {% set load_no_ac = [load_total - ac_w, 0] | max %}
          {% set soc = states('sensor.inverter_battery_soc')|float(0) %}
          {% set soc_min = states('input_number.soc_minimo')|float(0) %}
          {% set sun_up = is_state('sun.sun', 'above_horizon') %}

          {% if not sun_up %}
            noche
          {% elif soc <= soc_min %}
            critico
          {% elif solar < 120 %}
            primeros_rayitos
          {% elif solar < (load_no_ac * 0.35) %}
            amanecer_defensivo
          {% elif solar < load_no_ac %}
            transicion_baja
          {% elif solar < (load_no_ac + (ac_w * 0.5)) %}
            transicion_util
          {% elif solar >= (load_no_ac + (ac_w * 0.8)) or batt <= -150 %}
            solar_firme
          {% else %}
            solar_parcial
          {% endif %}
        attributes:
          solar_w: "{{ states('sensor.solar_total_power')|float(0) }}"
          battery_w: "{{ states('sensor.inverter_battery_power')|float(0) }}"
          ac_w: "{{ states('sensor.airconditionermultisensor_aire_potencia')|float(0) }}"
          load_total_w: "{{ states('sensor.inverter_load_total')|float(0) }}"
          load_no_ac_w: >
            {% set load_total = states('sensor.inverter_load_total')|float(0) %}
            {% set ac_w = states('sensor.airconditionermultisensor_aire_potencia')|float(0) %}
            {{ [load_total - ac_w, 0] | max }}

      - name: "Inverter Battery Power"
        unique_id: inverter_battery_power_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set v = states('sensor.inverter_battery_voltage')|float(0) %}
          {% set a = states('sensor.inverter_battery_current')|float(0) %}
          {{ (v * a) | round(0) }}

      - name: "Battery Charge Power"
        unique_id: battery_charge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.inverter_battery_power')|float(0) %}
          {{ -p if p < 0 else 0 }}

      - name: "Battery Discharge Power"
        unique_id: battery_discharge_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.inverter_battery_power')|float(0) %}
          {{ p if p > 0 else 0 }}

      - name: "Grid Usage"
        unique_id: grid_usage_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set va = states('sensor.inverter_grid_a_voltage')|float(0) %}
          {% set ia = states('sensor.inverter_grid_a_current')|float(0) %}
          {% set vb = states('sensor.inverter_grid_b_voltage')|float(0) %}
          {% set ib = states('sensor.inverter_grid_b_current')|float(0) %}
          {% set grid = (va * ia) + (vb * ib) %}
          {{ 0 if grid < 20 else (grid | round(0)) }}

      - name: "Solar Total Power"
        unique_id: solar_total_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ states('sensor.inverter_pv1_power')|float(0) +
             states('sensor.inverter_pv2_power')|float(0) }}

      - name: "Inverter Load Total"
        unique_id: inverter_load_total_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ states('sensor.inverter_load_1')|float(0)
           + states('sensor.inverter_load_2')|float(0) }}
           
      - name: "Solar Forecast Remaining Today Total"
        unique_id: solar_forecast_remaining_today_total_kwh
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {{ states('sensor.energy_production_today_remaining')|float(0)
           + states('sensor.energy_production_today_remaining_2')|float(0) }}

      - name: "kWh faltantes para SOC objetivo"
        unique_id: kwh_faltantes_soc_objetivo
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: measurement
        state: >
          {% set soc_now = states('sensor.inverter_battery_soc')|float(0) %}
          {% set soc_target = states('input_number.soc_objetivo')|float(0) %}
          {% set batt_kwh = states('input_number.battery_kwh')|float(0) %}
          {% set need = (soc_target - soc_now) / 100.0 * batt_kwh %}
          {{ [need, 0] | max | round(2) }}

      - name: "Alcanza a cargar hoy"
        unique_id: alcanza_a_cargar_hoy
        state: >
          {% set remaining_raw = states('sensor.solar_forecast_remaining_today_total') %}
          {% set need = states('sensor.kwh_faltantes_para_soc_objetivo')|float(0) %}
          {% set buffer = states('input_number.buffer_kwh')|float(0) %}

          {% if remaining_raw in ['unknown', 'unavailable', 'none', ''] %}
            {{ this.state if this.state not in ['unknown', 'unavailable', 'none', ''] else 'True' }}
          {% else %}
            {% set remaining = remaining_raw|float(0) %}
            {{ remaining >= (need + buffer) }}
          {% endif %}
          
      - name: "Solar Forecast Power Now Total"
        unique_id: solar_forecast_power_now_total_w
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ states('sensor.power_production_now')|float(0)
           + states('sensor.power_production_now_2')|float(0) }}
         
      - name: "power_bedroom_relay_2"
        unique_id: power_bedroom_relay_2
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% if is_state('switch.bedroomcontroller_relay_2', 'on') %}
            45
          {% else %}
            0
          {% endif %}
sensor:
  - platform: integration
    source: sensor.battery_charge_power
    name: "Battery Charge Energy"
    unique_id: battery_charge_energy
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    source: sensor.battery_discharge_power
    name: "Battery Discharge Energy"
    unique_id: battery_discharge_energy
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    source: sensor.grid_usage
    name: "Grid Energy Imported"
    unique_id: grid_energy_imported
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    source: sensor.solar_total_power
    name: "Solar Energy"
    unique_id: solar_energy_total
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    source: sensor.inverter_load_total
    name: "Load Energy"
    unique_id: load_energy_total
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    source: sensor.airconditionermultisensor_aire_potencia
    name: "Air Conditioner Energy"
    unit_prefix: k
    round: 2

  - platform: integration
    source: sensor.0x286d97000100dcfe_power
    name: energia_plug_0x286d
    unit_prefix: k
    round: 3
    method: left

  - platform: integration
    source: sensor.power_bedroom_relay_2
    name: "Bedroom Relay 2 Energy"
    unique_id: bedroom_relay_2_energy
    unit_prefix: k
    round: 3
    method: left

homeassistant:
  customize:
    sensor.energia_plug_0x286d:
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: kWh

    sensor.bedroom_relay_2_energy:
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: kWh
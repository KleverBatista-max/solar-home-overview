esphome:
  name: airconditionermultisensor
  friendly_name: airconditionermultisensor

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "<REDACTADO>"

ota:
  - platform: esphome
    password: "<REDACTADO>"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.68.60

  ap:
    ssid: "Airconditionermultisensor"
    password: "<REDACTADO>"

captive_portal:

sensor:
  # 1) Lectura analógica del CT (tu circuito lo deja centrado en 1.65V)
  - platform: adc
    pin: GPIO34
    id: ct_raw
    attenuation: 11db
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 2

  # 2) Corriente RMS desde el CT
  - platform: ct_clamp
    sensor: ct_raw
    name: "Aire Corriente"
    id: aire_current
    update_interval: 1s
    accuracy_decimals: 2
    filters:
      - calibrate_linear:
          - 0.00 -> 0.00
          - 1.00 -> 1.00

  # 3) Potencia aproximada (W) para 220V (midiendo una sola línea)
  - platform: template
    name: "Aire Potencia"
    id: aire_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float V = 220.0;
      return id(aire_current).state * V;
  - entity_id: sensor.airconditionermultisensor_temperatura_aire
    below: 21.999
    id: t20
    trigger: numeric_state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'on'
      - condition: state
        entity_id: input_boolean.aire_pro_bloqueo
        state: 'off'
      sequence:
      - action: remote.send_command
        target:
          entity_id: remote.rm_mini_3
        data:

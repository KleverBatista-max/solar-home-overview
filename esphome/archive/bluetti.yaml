esphome:
  name: bluetti
  friendly_name: Bluetti

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: VERY_VERBOSE

api:
  encryption:
    key: "<REDACTADO>"

ota:
  - platform: esphome
    password: "<REDACTADO>"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Bluetti Fallback Hotspot"
    password: "<REDACTADO>"

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 1100ms
    window: 1100ms

bluetooth_proxy:
  active: true
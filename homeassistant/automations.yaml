- id: '1772410847387'
  alias: 'A\C Smart Temp Energy '
  description: 'Escalona temperatura del aire con temperaturas del cuarto '
  triggers:
  - entity_id: input_boolean.air_conditioner
    to: 'on'
    id: 'on'
    trigger: state
  - entity_id: input_boolean.air_conditioner
    to: 'off'
    id: 'off'
    trigger: state
  - entity_id: input_select.aire_pro_objetivo
    id: force
    trigger: state
  - entity_id: sensor.airconditionermultisensor_temperatura_aire
    below: 26
    id: t25
    trigger: numeric_state
  - entity_id: sensor.airconditionermultisensor_temperatura_aire
    below: 25.999

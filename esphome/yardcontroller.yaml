esphome:
  name: yardcontroller
  friendly_name: yardcontroller

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "<REDACTADO>"

ota:
  - platform: esphome
    password: "<REDACTADO>"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.68.62

  ap:
    ssid: "Yardcontroller Fallback Hotspot"
    password: "<REDACTADO>"

captive_portal:

switch:
  - platform: gpio
    name: "Relay 1"
    id: relay1
    pin: 13
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relay 2"
    id: relay2
    pin: 12
    restore_mode: ALWAYS_OFF

  - platform: gpio
    name: "Relay 3"
    id: relay3
    pin: 14
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    name: "Switch Fisico 1"
    pin:
      number: 26
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_state:
      - switch.toggle: relay1

  - platform: gpio
    name: "Switch Fisico 2"
    pin:
      number: 27
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_state:
      - switch.toggle: relay2

  - platform: gpio
    name: "Switch Fisico 3"
    pin:
      number: 25
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_state:
      - switch.toggle: relay3
  mode: single
  variables:
    solar_hora_confianza: '{{ states(''input_number.solar_hora_confianza'')|float(9.5)
      }}'
    runtime_actual_h: '{{ states(''sensor.battery_runtime_hours_at_current_load'')|float(0)
      }}'
    forecast_next_hour_kwh: "{{ states('sensor.energy_next_hour')|float(0)\n + states('sensor.energy_next_hour_2')|float(0)
      }}\n"
    forecast_power_now_total: "{{ states('sensor.power_production_now')|float(0)\n
      + states('sensor.power_production_now_2')|float(0) }}\n"
    hora_actual_decimal: '{{ now().hour + (now().minute / 60) }}

      '
    horas_hasta_confianza: "{{ [states('input_number.solar_hora_confianza')|float(9.5)\n
      \  - (now().hour + (now().minute / 60)), 0] | max }}\n"
    modo_amanecer: '{{ states(''input_select.ac_modo_amanecer'')|string|trim }}'
    aire_pro_etapa: '{{ states(''input_select.aire_pro_etapa'')|string|trim }}'
    solar_total: '{{ states(''sensor.solar_total_power'')|float(0) }}'
    load_total: '{{ states(''sensor.inverter_load_total'')|float(0) }}'
    solar_estado: '{{ states(''sensor.solar_estado_real'')|string|trim }}'
    temp_air: '{{ states(''sensor.airconditionermultisensor_temperatura_aire'')|float(0)
      }}'
    ac_w: '{{ states(''sensor.airconditionermultisensor_aire_potencia'')|float(0)
      }}'
    batt_w: '{{ states(''sensor.inverter_battery_power'')|float(0) }}'
    soc: '{{ states(''sensor.inverter_battery_soc'')|float(0) }}'
    soc_min: '{{ states(''input_number.soc_minimo'')|float(0) }}'
    soc_reserva_noche: '{{ states(''input_number.soc_reserva_noche'')|float(0) }}'
    soc_objetivo: '{{ states(''input_number.soc_objetivo'')|float(82) }}'
    last_set: '{{ states(''input_text.ac_last_set'')|string|trim }}'
    alcanza: '{{ states(''sensor.alcanza_a_cargar_hoy'') == ''True'' }}'
    sun_up: '{{ is_state(''sun.sun'',''above_horizon'') }}'
    solar_ya_sostiene: '{{ solar_total >= load_total or batt_w <= 0 }}

      '
    confort_runtime_factor: 0.65
    confort_soc_buffer: 12
    descarga_warn_confort_dia: 550
    descarga_warn_activa: "{% if modo_amanecer == 'confort' and hora_actual_decimal
      < solar_hora_confianza %}\n  {{ descarga_warn_confort_dia }}\n{% else %}\n  {{
      descarga_warn }}\n{% endif %}"
    confort_base: "{{\n  modo_amanecer == 'confort'\n  and aire_pro_etapa in ['20','21','22']\n
      \ and sun_up\n  and now().hour < 11\n}}"
    confort_sostenible: "{{\n  confort_base\n  and soc > soc_min\n  and (\n    (\n
      \     hora_actual_decimal < solar_hora_confianza\n      and (\n        runtime_actual_h
      >= (horas_hasta_confianza * confort_runtime_factor)\n        or (\n          soc
      >= (soc_min + confort_soc_buffer)\n          and forecast_next_hour_kwh >= 0.35\n
      \       )\n        or alcanza\n      )\n    )\n    or\n    (\n      hora_actual_decimal
      >= solar_hora_confianza\n      and (\n        batt_w <= 0\n        or solar_total
      >= load_total\n        or forecast_power_now_total >= load_total\n      )\n
      \   )\n  )\n}}"

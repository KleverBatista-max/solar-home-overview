- id: '1775062509860'
  alias: A\C SSC v5.8.4
  description: Air Conditioner Smart Solar Controller v5.8.4
  triggers:
  - minutes: /3
    trigger: time_pattern
    id: tick
  - trigger: sun
    event: sunrise
    id: sunrise
  - trigger: sun
    event: sunset
    id: sunset
  conditions:
  - condition: state
    entity_id: input_boolean.auto_a_c
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: sunset
      sequence:
      - target:
          entity_id: input_boolean.aire_pro_bloqueo
        action: input_boolean.turn_off
      - target:
          entity_id: input_text.ac_solar_last_action
        data:
          value: sunset_libera_aire_pro
        action: input_text.set_value
      - stop: 'Atardecer: libero Aire Pro'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not sun_up }}'
      sequence:
      - target:
          entity_id: input_boolean.aire_pro_bloqueo
        action: input_boolean.turn_off
      - target:
          entity_id: input_text.ac_solar_last_action
        data:
          value: sin_sol
        action: input_text.set_value
      - stop: Sin sol
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.solar_dia_terminado
        state: 'off'
      sequence:
      - target:
          entity_id: input_boolean.aire_pro_bloqueo
        action: input_boolean.turn_on
  - choose:
    - conditions:
      - condition: template
        value_template: "{{\n  states('input_boolean.ac_manual_override') == 'off'\n
          \ and states('input_boolean.aire_pro_bloqueo') == 'on'\n  and states('sensor.airconditionermultisensor_aire_potencia')|float(0)
          > 5\n  and states('input_text.ac_last_set')|string|trim == 'off'\n  and
          states('input_select.aire_pro_etapa')|string|trim in ['20','21','22','23','24','25','26']\n}}\n"
      sequence:
      - target:
          entity_id: input_text.ac_last_set
        data:
          value: '{{ states(''input_select.aire_pro_etapa'')|string|trim }}'
        action: input_text.set_value
